# Dev-only, isolated browser acceptance target. Never use this file for production.
name: bft-browser-acceptance

services:
  feeding-tracker-browser:
    build: .
    # Matches the acceptance helpers; this disposable loopback-only name is never used by prod/dev.
    container_name: bft-browser-acceptance
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      PORT: "8080"
      NODE_ENV: development
      DB_DIR: /data
      DB_PATH: /data/feeding-tracker-browser.db
      # Default is unauthenticated for legacy acceptance; set BROWSER_AUTH_REQUIRED=1 for auth journeys.
      AUTH_REQUIRED: "${BROWSER_AUTH_REQUIRED:-0}"
      AUTH_ALLOWED_EMAILS: "${BROWSER_AUTH_ALLOWED_EMAILS:-}"
      AUTH_BYPASS: "0"
      ALLOW_INSECURE_LOCAL_MODE: "${BROWSER_ALLOW_INSECURE_LOCAL_MODE:-1}"
      NOTIFICATIONS_ENABLED: "0"
      PUBLIC_BASE_URL: http://127.0.0.1:8082
    # Ephemeral browser-gate state: never reads or writes Dev/production records.
    tmpfs:
      - /data:mode=1777
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
